server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets levam hash no nome (outputHashing: all), então um arquivo nunca
    # muda de conteúdo sem mudar de nome — cache longo é seguro.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # O index.html referencia os assets com hash; se ele ficar em cache,
    # o navegador continua pedindo o bundle antigo depois de um deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # O roteamento do Angular é client-side. Sem este fallback, acessar
    # /ranking direto (ou dar F5 fora da home) faz o nginx procurar um
    # arquivo que não existe e devolver 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
